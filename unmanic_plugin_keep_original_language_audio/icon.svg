<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
    <title id="title">Original Language Audio</title>
    <desc id="desc">A blue globe combined with a high-contrast audio waveform</desc>

    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#182b52"/>
            <stop offset="100%" stop-color="#0b132b"/>
        </linearGradient>

        <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#55c7ff"/>
            <stop offset="100%" stop-color="#2674d9"/>
        </linearGradient>

        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow
                    dx="0"
                    dy="8"
                    stdDeviation="8"
                    flood-color="#000000"
                    flood-opacity=".3"
            />
        </filter>

        <filter id="waveShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow
                    dx="0"
                    dy="2"
                    stdDeviation="2"
                    flood-color="#071126"
                    flood-opacity=".85"
            />
        </filter>
    </defs>

    <!-- Rounded plugin tile -->
    <rect
            x="8"
            y="8"
            width="240"
            height="240"
            rx="52"
            fill="url(#background)"
    />

    <!-- Globe -->
    <circle
            cx="128"
            cy="128"
            r="82"
            fill="url(#globe)"
            filter="url(#shadow)"
    />

    <!-- Globe longitude -->
    <path
            d="M128 46c-27 22-42 49-42 82s15 60 42 82
       c27-22 42-49 42-82s-15-60-42-82Z"
            fill="none"
            stroke="#d9f4ff"
            stroke-width="6"
            opacity=".85"
    />

    <!-- Globe latitude -->
    <path
            d="M48 128h160
       M59 86c20 10 43 15 69 15s49-5 69-15
       M59 170c20-10 43-15 69-15s49 5 69 15"
            fill="none"
            stroke="#d9f4ff"
            stroke-width="6"
            stroke-linecap="round"
            opacity=".85"
    />

    <!-- Audio waveform dark contrast outline -->
    <path
            d="M42 128h14
       l8-20
       l11 40
       l14-72
       l15 104
       l14-58
       l12 34
       l13-24
       l13 24
       l12-34
       l14 58
       l15-104
       l14 72
       l11-40
       l8 20
       h14"
            fill="none"
            stroke="#071126"
            stroke-width="15"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity=".95"
    />

    <!-- Audio waveform -->
    <path
            d="M42 128h14
       l8-20
       l11 40
       l14-72
       l15 104
       l14-58
       l12 34
       l13-24
       l13 24
       l12-34
       l14 58
       l15-104
       l14 72
       l11-40
       l8 20
       h14"
            fill="none"
            stroke="#ffffff"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#waveShadow)"
    />
</svg>